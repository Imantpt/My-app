<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #E9DCCB; font-family: sans-serif; }

    #stage { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); }
    #stage > img.bg { width: 100%; height: 100%; display: block; }

    .piece { position: absolute; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .piece img { display: block; width: 100%; height: auto; -webkit-user-drag: none; pointer-events: none; }
    .hidden { display: none !important; }
    .shadow { position: absolute; left: 4%; right: 4%; bottom: -3%; height: 10%; z-index: -1;
              background: radial-gradient(ellipse at center, rgba(0,0,0,.38) 0%, rgba(0,0,0,0) 70%); }

    .piece.sel img { filter: brightness(1.08) drop-shadow(0 0 8px rgba(255,255,255,.95)); }
    .piece.moving { outline: 2px dashed #fff; outline-offset: 4px; touch-action: none; }

    #item-tv img.tvimg { width: 84%; margin: 0 auto -1px; }
    .console { position: relative; width: 100%; height: 0; padding-bottom: 30%;
               border-radius: 5px 5px 3px 3px;
               background: linear-gradient(#DCC8AA, #B99D7A);
               box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 3px 6px rgba(0,0,0,.25); }
    .console::before { content: ""; position: absolute; left: 50%; top: 12%; bottom: 12%; width: 1px; background: rgba(0,0,0,.2); }

    .drop { animation: drop .7s ease-out; }
    @keyframes drop {
      from { opacity: 0; transform: translateY(-70px) scale(1.04); }
      to   { opacity: 1; transform: none; }
    }

    .hud { position: fixed; top: 12px; z-index: 20; padding: 10px 16px; border-radius: 22px; font-size: 16px; font-weight: bold; border: 0; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
    #shopBtn { left: 12px; background: #fff; color: #333; }
    #balance { right: 12px; background: #0F8B8D; color: #fff; }

    /* نوار پایین برای فروش و جابهجایی */
    #bar { position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 25; background: rgba(255,255,255,.96);
           border-radius: 18px; padding: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
           box-shadow: 0 4px 16px rgba(0,0,0,.3); }
    .bartitle { width: 100%; font-weight: bold; text-align: center; font-size: 14px; color: #333; }
    .b { flex: 1; font-size: 15px; padding: 10px 8px; border: 0; border-radius: 12px; background: #0F8B8D; color: #fff; font-family: inherit; }
    .b small { display: block; font-size: 11px; opacity: .9; }
    .b.sell { background: #D9534F; }
    .b.ok { background: #2E9B4F; }
    .b.close { flex: 0 0 48px; background: #ddd; color: #444; }
    #size { flex: 2; direction: ltr; min-width: 120px; }

    #dim { position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 30; }
    #dim.open { opacity: 1; pointer-events: auto; }
    #panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 75%; overflow-y: auto; background: #FFE4EC; border-radius: 22px 22px 0 0; padding: 16px; z-index: 40; transform: translateY(105%); transition: transform .3s; box-shadow: 0 -4px 16px rgba(0,0,0,.25); }
    #panel.open { transform: none; }
    .phead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .phead h2 { margin: 0; }
    .x { background: transparent; border: 0; font-size: 22px; color: #555; }
    .row { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 12px; padding: 10px 14px; margin: 8px 0; }
    .thumb { width: 84px; height: 56px; object-fit: contain; }
    .row .info { flex: 1; }
    .row .price { font-size: 13px; color: #777; }
    .buy { font-size: 15px; padding: 9px 14px; border: 0; border-radius: 10px; background: #0F8B8D; color: #fff; }
    .buy:disabled { background: #D5DBE6; color: #777; }
    #reset { display: block; margin: 18px auto 0; background: transparent; border: 0; color: #888; text-decoration: underline; font-size: 14px; }
  </style>
</head>
<body>

  <div id="stage">
    <img class="bg" id="bg" src="room.jpeg" alt="">

    <div class="piece hidden" id="item-tv">
      <img class="tvimg" src="tv.webp" alt="">
      <div class="console"></div>
      <div class="shadow"></div>
    </div>

    <div class="piece hidden" id="item-bed">
      <img src="bed.webp" alt="">
      <div class="shadow"></div>
    </div>

    <div class="piece hidden" id="item-sofa">
      <img src="sofa.webp" alt="">
      <div class="shadow"></div>
    </div>
  </div>

  <button class="hud" id="shopBtn" onclick="openShop()">🛒 فروشگاه</button>
  <div class="hud" id="balance"></div>

  <div id="bar" class="hidden"></div>

  <div id="dim" onclick="closeShop()"></div>
  <div id="panel">
    <div class="phead">
      <h2>فروشگاه</h2>
      <button class="x" onclick="closeShop()">✕</button>
    </div>
    <div id="list"></div>
    <button id="reset" onclick="resetGame()">شروع دوباره</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }
    const canSave = tg && tg.initData && tg.isVersionAtLeast("6.9");
    const stage = document.getElementById("stage");

    let ASPECT = 1179 / 2085;

    function fit() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      const h = Math.max(H, W / ASPECT);
      stage.style.height = h + "px";
      stage.style.width = (h * ASPECT) + "px";
    }

    const bg = document.getElementById("bg");
    function readAspect() {
      if (bg.naturalWidth && bg.naturalHeight) {
        ASPECT = bg.naturalWidth / bg.naturalHeight;
        fit();
      }
    }
    bg.addEventListener("load", readAspect);
    if (bg.complete) readAspect();

    fit();
    window.addEventListener("resize", fit);
    if (tg) tg.onEvent("viewportChanged", fit);

    const START = 1000000;
    let balance = START;
    let owned = [];
    let pos = {};            // جای هر وسیله: x (فاصله از چپ)، y (فاصله از پایین)، w (عرض) به درصد
    let selectedId = null;
    let mode = "menu";       // menu یا move

    const items = [
      { id: "bed",  name: "تخت",      img: "bed.webp",  price: 300000 },
      { id: "sofa", name: "کاناپه",   img: "sofa.webp", price: 250000 },
      { id: "tv",   name: "تلویزیون", img: "tv.webp",   price: 180000 }
    ];

    // جای اولیهی وسایل وقتی تازه خریده می‌شوند
    const DEFAULTS = {
      bed:  { x: 25,   y: 28, w: 44 },
      sofa: { x: 17,   y: 9,  w: 66 },
      tv:   { x: 69.5, y: 33, w: 21 }
    };

    const fa = n => Number(n).toLocaleString("fa-IR");

    // ---------- ذخیره و بازیابی ----------
    function save() {
      if (canSave) {
        tg.CloudStorage.setItem("game2", JSON.stringify({ balance: balance, owned: owned, pos: pos }));
      }
    }

    function load() {
      if (canSave) {
        tg.CloudStorage.getItem("game2", function (err, value) {
          if (!err && value) {
            try {
              const d = JSON.parse(value);
              balance = d.balance;
              owned = d.owned;
              pos = d.pos || {};
            } catch (e) {}
          }
          drawAll();
        });
      } else {
        drawAll();
      }
    }

    // ---------- فروشگاه ----------
    function openShop() {
      clearSelection();
      document.getElementById("panel").classList.add("open");
      document.getElementById("dim").classList.add("open");
    }
    function closeShop() {
      document.getElementById("panel").classList.remove("open");
      document.getElementById("dim").classList.remove("open");
    }

    function buy(id) {
      const item = items.find(i => i.id === id);
      if (!item || owned.includes(id) || balance < item.price) return;
      balance = balance - item.price;
      owned.push(id);
      pos[id] = Object.assign({}, DEFAULTS[id]);
      save();
      drawAll(id);
      closeShop();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    }

    function resetGame() {
      balance = START;
      owned = [];
      pos = {};
      clearSelection();
      save();
      drawAll();
    }

    // ---------- جای وسایل ----------
    function clampPos(p) {
      p.x = Math.min(Math.max(p.x, -p.w * 0.3), 100 - p.w * 0.7);
      p.y = Math.min(Math.max(p.y, -3), 85);
    }

    function applyPos(id) {
      const el = document.getElementById("item-" + id);
      const p = pos[id];
      if (!el || !p) return;
      el.style.left = p.x + "%";
      el.style.bottom = p.y + "%";
      el.style.width = p.w + "%";
      el.style.zIndex = 100 - Math.round(p.y); // هرچه پایین‌تر، جلوتر
    }

    // ---------- انتخاب وسیله ----------
    function selectPiece(id) {
      clearSelection();
      selectedId = id;
      mode = "menu";
      document.getElementById("item-" + id).classList.add("sel");
      renderBar();
    }

    function clearSelection() {
      if (selectedId && mode === "move") save();
      document.querySelectorAll(".piece").forEach(function (el) {
        el.classList.remove("sel");
        el.classList.remove("moving");
      });
      selectedId = null;
      mode = "menu";
      renderBar();
    }

    function startMove() {
      mode = "move";
      document.getElementById("item-" + selectedId).classList.add("moving");
      renderBar();
    }

    function finishMove() {
      save();
      mode = "menu";
      clearSelection();
    }

    function resizeSelected(v) {
      const p = pos[selectedId];
      if (!p) return;
      const newW = Number(v);
      const center = p.x + p.w / 2;
      p.w = newW;
      p.x = center - newW / 2;
      clampPos(p);
      applyPos(selectedId);
    }

    function askConfirm(msg, cb) {
      if (tg && tg.initData && tg.isVersionAtLeast("6.2")) {
        tg.showConfirm(msg, cb);
      } else {
        cb(window.confirm(msg));
      }
    }

    function sellSelected() {
      const id = selectedId;
      const item = items.find(i => i.id === id);
      if (!item) return;
      askConfirm("«" + item.name + "» فروخته شود و " + fa(item.price) + " تومان به حسابتان برگردد؟", function (ok) {
        if (!ok) return;
        balance += item.price;
        owned = owned.filter(x => x !== id);
        delete pos[id];
        clearSelection();
        save();
        drawAll();
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      });
    }

    function renderBar() {
      const bar = document.getElementById("bar");
      if (!selectedId) { bar.classList.add("hidden"); bar.innerHTML = ""; return; }
      const item = items.find(i => i.id === selectedId);
      bar.classList.remove("hidden");
      if (mode === "menu") {
        bar.innerHTML = `
          <div class="bartitle">${item.name}</div>
          <button class="b sell" onclick="sellSelected()">💰 فروش<small>+${fa(item.price)} تومان</small></button>
          <button class="b" onclick="startMove()">✋ جابه‌جایی</button>
          <button class="b close" onclick="clearSelection()">✕</button>`;
      } else {
        bar.innerHTML = `
          <div class="bartitle">${item.name}: وسیله را با انگشت بکشید</div>
          <input id="size" type="range" min="8" max="95" step="1" value="${Math.round(pos[selectedId].w)}" oninput="resizeSelected(this.value)">
          <button class="b ok" onclick="finishMove()">✔ تأیید</button>`;
      }
    }

    // ---------- لمس و کشیدن ----------
    let drag = null;

    document.querySelectorAll(".piece").forEach(function (el) {
      const id = el.id.replace("item-", "");

      el.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (mode === "move") return;
        if (!owned.includes(id)) return;
        selectPiece(id);
      });

      el.addEventListener("pointerdown", function (ev) {
        if (mode !== "move" || selectedId !== id) return;
        const r = stage.getBoundingClientRect();
        drag = { id: id, sx: ev.clientX, sy: ev.clientY, x: pos[id].x, y: pos[id].y, W: r.width, H: r.height };
        el.setPointerCapture(ev.pointerId);
        ev.preventDefault();
      });

      el.addEventListener("pointermove", function (ev) {
        if (!drag || drag.id !== id) return;
        const p = pos[id];
        p.x = drag.x + (ev.clientX - drag.sx) / drag.W * 100;
        p.y = drag.y - (ev.clientY - drag.sy) / drag.H * 100;
        clampPos(p);
        applyPos(id);
      });

      const end = function () { drag = null; };
      el.addEventListener("pointerup", end);
      el.addEventListener("pointercancel", end);
    });

    // لمس جای خالی اتاق: بستن منوی انتخاب (نه در حالت جابه‌جایی)
    stage.addEventListener("click", function () {
      if (selectedId && mode === "menu") clearSelection();
    });

    // ---------- نمایش ----------
    function drawAll(newId) {
      document.getElementById("balance").textContent = "🪙 " + fa(balance) + " تومان";

      items.forEach(function (item) {
        const el = document.getElementById("item-" + item.id);
        const has = owned.includes(item.id);
        el.classList.toggle("hidden", !has);
        el.classList.remove("drop");
        if (has) {
          if (!pos[item.id]) pos[item.id] = Object.assign({}, DEFAULTS[item.id]);
          applyPos(item.id);
          if (item.id === newId) {
            void el.getBoundingClientRect();
            el.classList.add("drop");
          }
        }
      });

      document.getElementById("list").innerHTML = items.map(function (item) {
        const has = owned.includes(item.id);
        const poor = balance < item.price;
        const label = has ? "خریده‌ای ✓" : poor ? "پول کافی نیست" : "بخر";
        return `
          <div class="row">
            <img class="thumb" src="${item.img}" alt="">
            <div class="info">
              <div>${item.name}</div>
              <div class="price">${fa(item.price)} تومان</div>
            </div>
            <button class="buy" onclick="buy('${item.id}')" ${has || poor ? "disabled" : ""}>${label}</button>
          </div>`;
      }).join("");
    }

    load();
  </script>
</body>
</html>
